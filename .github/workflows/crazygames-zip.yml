name: Build CrazyGames ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npx vite build
      - name: Upload CrazyGames Dist ZIP
        uses: actions/upload-artifact@v4
        with:
          name: desi-dangal-crazygames
          path: dist/
